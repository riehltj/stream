<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outro / Raid</title>
  <link rel="stylesheet" href="../shared/shared.css" />
  <link rel="stylesheet" href="outro-raid.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="grid-lines"></div>
  <div class="particles" id="particles"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Flash overlay -->
  <div class="flash-overlay" id="flash"></div>

  <!-- Corner accents -->
  <div class="corner corner--tl" id="cornerTL"></div>
  <div class="corner corner--tr" id="cornerTR"></div>
  <div class="corner corner--bl" id="cornerBL"></div>
  <div class="corner corner--br" id="cornerBR"></div>

  <!-- Particle burst -->
  <div class="burst-container" id="burst"></div>

  <!-- ── OUTRO MODE ── -->
  <div class="stage" id="outroStage">
    <div class="eyebrow" id="outroEyebrow">STREAM OVER</div>

    <div class="title-wrap">
      <div class="title" id="outroTitle">GG</div>
    </div>

    <div class="stage-divider" id="outroDivider"></div>

    <div class="tagline" id="outroTagline">Thanks for hanging — catch the next one</div>

    <div class="socials-row" id="socialsRow">
      <div class="social-chip">
        <svg class="social-icon social-icon--twitch" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
        <div class="social-info">
          <div class="social-platform">TWITCH</div>
          <div class="social-handle" id="twitchHandle"></div>
        </div>
      </div>
      <div class="social-chip">
        <svg class="social-icon social-icon--x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
        <div class="social-info">
          <div class="social-platform">X</div>
          <div class="social-handle" id="twitterHandle"></div>
        </div>
      </div>
      <div class="social-chip">
        <svg class="social-icon social-icon--youtube" viewBox="0 0 24 24" aria-hidden="true"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.070 0 12 0 12s0 3.930.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.930 24 12 24 12s0-3.930-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <div class="social-info">
          <div class="social-platform">YOUTUBE</div>
          <div class="social-handle" id="youtubeHandle"></div>
        </div>
      </div>
    </div>

    <div class="follow-cta" id="followCta">Follow · Clip it · See you next time</div>
  </div>

  <!-- ── RAID MODE ── -->
  <div class="stage hidden" id="raidStage">
    <div class="eyebrow" id="raidEyebrow">RIGHT NOW</div>

    <div class="title-wrap">
      <div class="title raid-line1">WE'RE RAIDING</div>
      <div class="title raid-line2" id="raidTarget"></div>
    </div>

    <div class="stage-divider" id="raidDivider"></div>

    <div class="tagline">Head over and show some love</div>

    <div class="raid-cta">
      <div class="raid-cta-inner">
        <span class="raid-arrow">→</span>
        <span class="raid-cta-text" id="raidCtaText"></span>
      </div>
    </div>
  </div>

  <script src="../shared/shared.js"></script>
  <script src="../shared/config.js"></script>
  <script src="outro-raid.js"></script>
</body>
</html>
