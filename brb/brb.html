<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be Right Back</title>
  <link rel="stylesheet" href="../shared/shared.css" />
  <link rel="stylesheet" href="brb.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg"></div>
  <div class="grid-lines"></div>
  <div class="sweep"></div>
  <div class="particles" id="particles"></div>
  <div class="scanlines"></div>

  <!-- Pulse rings (broadcast feel) -->
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <!-- Corner accents -->
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo"><span>■</span> StreamCenter</div>
    <div class="live-badge">
      <div class="live-dot active"></div>
      <span>BRB</span>
    </div>
    <div class="topbar-time" id="clock"></div>
  </div>

  <!-- Main stage -->
  <main class="stage">

    <!-- Hero: BE RIGHT BACK title -->
    <div class="hero">
      <div class="eyebrow" id="eyebrow"><span data-icon="zap"></span> &nbsp; Quick Break &nbsp; <span data-icon="zap"></span></div>

      <div class="title-wrap">
        <div class="title-bg-text">Break</div>
        <div class="title">
          <span class="title-line1">BE RIGHT</span><span class="title-line2">BACK</span>
        </div>
      </div>

      <div class="divider"></div>
    </div>

    <!-- Lower panels -->
    <div class="lower-panels">

      <!-- While You Wait -->
      <div class="panel wait-panel">
        <div class="panel-header">
          <span class="panel-header-line"></span>
          WHILE YOU WAIT
          <span class="panel-header-line"></span>
        </div>
        <ul class="wait-list" id="waitList"></ul>
      </div>

      <!-- Break Report -->
      <div class="panel report-panel">
        <div class="panel-header">
          <span class="panel-header-line"></span>
          BREAK REPORT
          <span class="panel-header-line"></span>
        </div>
        <div class="report-body">
          <div class="report-quote" id="reportQuote">"Loading analysis..."</div>
          <div class="report-source" id="reportSource">— StreamCenter Analytics</div>
        </div>
      </div>

      <!-- Up Next teaser -->
      <div class="panel teaser-panel">
        <div class="panel-header">
          <span class="panel-header-line"></span>
          UP NEXT
          <span class="panel-header-line"></span>
        </div>
        <div class="teaser-items" id="teaserItems"></div>
      </div>

    </div>

  </main>

  <!-- Ticker -->
  <div class="ticker-wrap">
    <div class="ticker-tag">BRB</div>
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <script src="../shared/shared.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="brb.js"></script>
</body>
</html>
